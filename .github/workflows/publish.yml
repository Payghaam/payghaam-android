name: Publish
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      # TEMPORARY debug step — remove once signing works. Prints only a byte
      # count (not the secret itself) so we can confirm the key is actually
      # reaching this job with the expected length, rather than being empty,
      # truncated, or masked away by something upstream.
      - run: |
          echo "signingInMemoryKey length: ${#ORG_GRADLE_PROJECT_signingInMemoryKey}"
          echo "signingInMemoryKeyId: '${ORG_GRADLE_PROJECT_signingInMemoryKeyId}'"
          echo "signingInMemoryKeyPassword length: ${#ORG_GRADLE_PROJECT_signingInMemoryKeyPassword}"
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
      # Secrets required in this repo's Settings -> Secrets and variables ->
      # Actions (see RELEASING.md for how to get each one):
      #   MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD  — Central Portal user token
      #   SIGNING_IN_MEMORY_KEY, SIGNING_IN_MEMORY_KEY_ID  — GPG key for signing artifacts
      #   SIGNING_IN_MEMORY_KEY_PASSWORD                    — that key's passphrase
      - run: gradle :payghaam:publish --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
